name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, unit and e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: worthit
          POSTGRES_PASSWORD: worthit
          POSTGRES_DB: worthit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worthit -d worthit_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://worthit:worthit@localhost:5432/worthit_test
      REDIS_URL: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` triggers postinstall -> prisma generate; husky's prepare hook
      # is a no-op in CI because HUSKY=0.
      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check build
        run: npm run build

      - name: Unit tests
        run: npm run test -- --ci

      # `pretest:e2e` applies migrations to the service-container database first.
      - name: E2E tests
        run: npm run test:e2e -- --ci
